# Builds the three installers (Windows NSIS, macOS DMG, Linux AppImage/deb) on
# every v* tag and attaches them to a GitHub release. Each platform packages its
# own third-party binaries via npm run fetch-bins.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifacts: dist/*.exe
          - os: macos-latest
            artifacts: dist/*.dmg
          - os: ubuntu-latest
            artifacts: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download ffmpeg, ffprobe and Shaka Packager
        run: npm run fetch-bins

      - run: npm run typecheck
      - run: npm test

      - name: Build installer
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifacts }}
